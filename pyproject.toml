[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "garmin-morning"
version = "0.1.0"
description = "A personal LangGraph Garmin morning report, powered by Gemini"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "jinja2>=3.1,<4",
  "pydantic[email]>=2.10,<3", "fastmcp>=2.14,<3",
  "langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4",
  "langchain-google-genai>=4,<5", "keyring>=25,<26", "garth>=0.5,<0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
garmin-agent = "garmin_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
garmin_agent = ["templates/*.html", "templates/*.txt", "static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
